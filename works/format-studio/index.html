<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Format Studio — 広告画像エディター</title><link rel="stylesheet" href="../projects.css"><body class="editor"><header><a href="../../index.html#labs">Yasu / アプリ事例</a><small>CREATIVE TOOL</small></header><main><small>広告画像エディター</small><h1>Format Studio.</h1><p>商品名と配色を決めて、配信先に合うサイズの広告画像を作れます。</p><div class="layout"><div class="controls"><label for="title">商品名・見出し</label><input id="title" maxlength="40" value="Fleur."><label for="tag">キャッチコピー</label><input id="tag" maxlength="60" value="朝の光を、ひと吹き。"><label for="size">配信サイズ</label><select id="size"><option value="1080,1920">ストーリー / 1080 × 1920</option><option value="1080,1080">フィード / 1080 × 1080</option><option value="1920,1080">横長 / 1920 × 1080</option></select><label for="palette">配色</label><select id="palette"><option value="amber">Amber / 琥珀</option><option value="forest">Forest / 森</option><option value="night">Night / 夜</option></select><button id="save">PNGを保存</button><output aria-live="polite"></output></div><div class="preview"><canvas aria-label="入力内容を反映した広告画像プレビュー"></canvas></div></div></main><footer>自主制作 / ブラウザ内で画像を生成 <a href="../../index.html?service=app#contact">アプリ制作を相談する</a></footer><script src="editor.js"></script></body></html>
