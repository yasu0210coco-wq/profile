<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel Studio（カルーセルメーカー）｜Yasu</title><link rel="stylesheet" href="studio.css"></head>
<body><header><a href="../../index.html#labs">Yasu / ポートフォリオ</a><a href="#edit">編集する</a></header>
<main><h1>Carousel <i>Studio.</i></h1><p>Instagramカルーセルメーカー</p>
<section class="proof"><div class="row"><h2>投稿プレビュー</h2><span id="count"></span></div><div id="strip" tabindex="0" aria-label="全スライドの横スクロールプレビュー"></div><p class="hint">横にスクロールして全ページを確認できます。</p></section>
<section id="edit"><h2>投稿を編集</h2><div class="design"><label>配色テーマ<select id="theme"><option value="sage">セージ / 明るいグリーン</option><option value="berry">ベリー / 落ち着いたワイン</option><option value="blue">ブルー / 澄んだ青</option></select></label><label>文字サイズ<select id="size"><option value="1.15">大</option><option value="1" selected>中</option><option value=".85">小</option></select></label></div>
<fieldset><legend>表紙</legend><label>テーマ（表紙タイトル）<input id="title" maxlength="80" value="買う前に測る「3か所」"></label><label>サブタイトル<input id="sub" maxlength="120" value="狭いキッチンの収納で失敗しないために"></label></fieldset>
<div id="pages"></div><button id="add" type="button">＋ 本文スライドを追加</button>
<fieldset><legend>最終ページ</legend><label>まとめの本文<textarea id="closing" maxlength="280">測ってから買うと、無駄な買い物が減ります。</textarea></label><p>「まとめ」の見出しと「あとで見返せるように保存してね」を自動で入れます。</p></fieldset></section>
<section class="export"><h2>画像を書き出す</h2><p>1080 × 1350 px ／ ページ順のPNGをZIPにまとめます。</p><button id="save" type="button">全ページをPNGで保存（ZIP）</button><p id="status" role="status"></p></section>
<footer><p>このクオリティの投稿制作を、クラウドワークスで1本からお受けしています。</p><a href="../../index.html#contact">制作のご相談</a></footer></main>
<script defer src="vendor/jszip.min.js"></script><script defer src="editor.js"></script></body></html>
